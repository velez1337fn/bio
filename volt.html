<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt Energy · чистая энергия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #eef5e8;
            font-family: system-ui, -apple-system;
            color: #1f2a1b;
        }
        .top {
            background: #1b3b1a;
            color: white;
            text-align: center;
            padding: 4rem 2rem;
        }
        h1 {
            font-size: 3.5rem;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            padding: 3rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 220px;
        }
        .cta {
            text-align: center;
            padding: 3rem;
            background: #cbdcc2;
        }
        .button {
            background: #2c5e2a;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            text-decoration: none;
            display: inline-block;
        }
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="top">
    <h1>Volt Energy</h1>
    <p>Солнечные станции · Электрозарядки · Умные сети</p>
</div>
<div class="grid">
    <div class="card"><h3>🔋 Для дома</h3><p>Установка и мониторинг</p></div>
    <div class="card"><h3>🏭 Для бизнеса</h3><p>Снижение счетов до 70%</p></div>
    <div class="card"><h3>🌱 Зелёный тариф</h3><p>Продавайте излишки энергии</p></div>
</div>
<div class="cta">
    <a href="#" class="button">Рассчитать окупаемость</a>
</div>
<footer>Volt Energy · 2026 · чистое будущее</footer>
</body>
</html>
