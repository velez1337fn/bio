<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirage AI · нейросети для бизнеса</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #010101;
            font-family: 'Inter', system-ui;
            color: #f5f5f7;
        }
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #000);
        }
        h1 {
            font-size: 4rem;
            background: linear-gradient(135deg, #fff, #9f9fff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sub {
            font-size: 1.2rem;
            margin: 1rem 0;
            color: #aaa;
        }
        .btn-group {
            margin-top: 2rem;
        }
        .btn {
            background: #2f2f7a;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            text-decoration: none;
            color: white;
            margin: 0 0.5rem;
            display: inline-block;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            padding: 4rem 2rem;
            background: #050508;
        }
        .feat {
            max-width: 280px;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.8rem;
            color: #555;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<div class="hero">
    <h1>Mirage AI</h1>
    <div class="sub">Генерация изображений · текстов · аналитика</div>
    <div class="btn-group">
        <a href="#" class="btn">Попробовать бесплатно</a>
    </div>
</div>
<div class="features">
    <div class="feat"><h3>⚡ Быстро</h3><p>Инференс за секунды</p></div>
    <div class="feat"><h3>🔒 Приватно</h3><p>Ваши данные не используются для обучения</p></div>
    <div class="feat"><h3>🌍 API</h3><p>Интеграция с вашими проектами</p></div>
</div>
<footer>Mirage AI · демо-версия одностраничника</footer>
</body>
</html>
